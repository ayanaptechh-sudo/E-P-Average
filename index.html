        function patchFetch(target) {
          try {
            if (!target) return;

            if (desc && (desc.configurable || typeof desc.set === 'undefined')) {
              var currentFn = nativeFetch;

                set: function(fn) { currentFn = fn; },

        }

          patchFetch(window);

              (typeof msg === 'string' && (msg.indexOf('Cannot set property fetch') !== -1 || msg.indexOf('requests.js') !== -1))) {
